  <polygon points="16.3,19.6 21.5,22.6 21.5,28.6 16.3,31.6 11.1,28.6 11.1,22.6" fill="#ffffff" fill-opacity="0.92"/>
  <polygon points="27.7,19.6 32.9,22.6 32.9,28.6 27.7,31.6 22.5,28.6 22.5,22.6" fill="#ffffff" fill-opacity="0.92"/>
