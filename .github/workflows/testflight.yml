name: TestFlight

# Builds the iOS app in Release, signs it with Xcode cloud signing (App Store Connect API key — no Mac,
# certificates or provisioning profiles needed locally) and uploads it to App Store Connect / TestFlight.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID                  10-character Team ID (developer.apple.com/account → Membership details)
#   APP_STORE_CONNECT_KEY_ID       Key ID of an App Store Connect API key with the Admin role
#   APP_STORE_CONNECT_ISSUER_ID    Issuer ID shown above the key list in App Store Connect
#   APP_STORE_CONNECT_API_KEY_P8   Full contents of the downloaded AuthKey_<KEYID>.p8 file
#
# Until all four secrets exist the job reports a notice and succeeds without building.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/HivePulse/**'
      - 'ios/project.yml'

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  upload:
    name: Build & upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      # Monotonic build number per upload; the marketing version stays in Info.plist
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check signing secrets
        id: secrets
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=TestFlight skipped::App Store Connect secrets are not configured yet (see the header of testflight.yml)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Select Xcode
        if: steps.secrets.outputs.ready == 'true'
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen and generate project
        if: steps.secrets.outputs.ready == 'true'
        run: |
          brew install xcodegen
          cd ios && xcodegen generate --spec project.yml

      - name: Write App Store Connect API key
        if: steps.secrets.outputs.ready == 'true'
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive (Release, cloud signing)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          xcodebuild archive \
            -project ios/HivePulse.xcodeproj \
            -scheme HivePulse \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HivePulse.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export & upload to App Store Connect
        if: steps.secrets.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HivePulse.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Summary
        if: steps.secrets.outputs.ready == 'true'
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' ios/HivePulse/Resources/Info.plist)
          {
            echo "### Uploaded HivePulse $VERSION ($BUILD_NUMBER) to App Store Connect"
            echo "Processing takes about 5–15 minutes; the build then appears in TestFlight for internal testers."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always() && steps.secrets.outputs.ready == 'true'
        run: rm -f "$ASC_KEY_PATH"
