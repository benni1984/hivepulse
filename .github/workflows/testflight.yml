name: TestFlight

# Builds the iOS app in Release, signs it with Xcode cloud signing (App Store Connect API key — no Mac,
# certificates or provisioning profiles needed locally) and uploads it to App Store Connect / TestFlight.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID                  10-character Team ID (developer.apple.com/account → Membership details)
#   APP_STORE_CONNECT_KEY_ID       Key ID of an App Store Connect API key with the Admin role
#   APP_STORE_CONNECT_ISSUER_ID    Issuer ID shown above the key list in App Store Connect
#   APP_STORE_CONNECT_API_KEY_P8   Full contents of the downloaded AuthKey_<KEYID>.p8 file
#   IOS_DIST_CERT_P12_BASE64       Base64 of the Apple Distribution certificate + private key (.p12)
#   IOS_DIST_CERT_P12_PASSWORD     Password of that .p12
#
# Distribution signing uses our own certificate from a temporary keychain instead of Xcode's cloud-managed
# one: the cloud signer writes the account name ("Benjamin Müller") into the designated requirement in a
# different Unicode form than the certificate, so the signature fails its own requirement (ITMS-90035).
#
# Until all secrets exist the job reports a notice and succeeds without building.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/HivePulse/**'
      - 'ios/project.yml'

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  upload:
    name: Build & upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      DIST_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
      # Monotonic build number per upload; the marketing version stays in Info.plist
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check signing secrets
        id: secrets
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] \
             && [ -n "$DIST_P12_BASE64" ] && [ -n "$DIST_P12_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=TestFlight skipped::App Store Connect secrets are not configured yet (see the header of testflight.yml)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Select Xcode
        if: steps.secrets.outputs.ready == 'true'
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen and generate project
        if: steps.secrets.outputs.ready == 'true'
        run: |
          brew install xcodegen
          cd ios && xcodegen generate --spec project.yml

      - name: Write App Store Connect API key
        if: steps.secrets.outputs.ready == 'true'
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Import distribution certificate into a temporary keychain
        if: steps.secrets.outputs.ready == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "=== identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN" | sed -E 's/"[^"]*\(([A-Z0-9]{10})\)"/"<name> (\1)"/'

      - name: App Store provisioning profile (fastlane sigh)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          json.dump({
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": os.environ["ASC_KEY_P8"],
              "in_house": False,
          }, open(os.path.join(os.environ["RUNNER_TEMP"], "asc_api_key.json"), "w"))
          PY
          fastlane sigh \
            --api_key_path "$RUNNER_TEMP/asc_api_key.json" \
            --app_identifier com.hivepulse.app \
            --platform ios \
            --output_path "$RUNNER_TEMP/profiles" \
            --filename AppStore.mobileprovision
          rm -f "$RUNNER_TEMP/asc_api_key.json"
          PROFILE="$RUNNER_TEMP/profiles/AppStore.mobileprovision"
          UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -)
          NAME=$(security cms -D -i "$PROFILE" | plutil -extract Name raw -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Installed App Store profile: $NAME"

      # Automatic signing during `archive` uses a cloud-managed *iOS App Development* profile, which Apple
      # only issues once at least one device is registered to the team (developer.apple.com → Devices).
      # An unsigned archive is not an option: the export re-sign is rejected as "Invalid Signature".
      # The export step then re-signs the app for App Store distribution.
      - name: Archive (Release, cloud signing)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          xcodebuild archive \
            -project ios/HivePulse.xcodeproj \
            -scheme HivePulse \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HivePulse.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      # Diagnostics: export the same archive to an IPA first and print its code signature, so a rejected
      # upload shows which certificate cloud signing actually applied (Apple Distribution vs. development/ad hoc).
      - name: Inspect distribution signature
        if: steps.secrets.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportToFile.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.hivepulse.app</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HivePulse.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportToFile.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          mkdir -p "$RUNNER_TEMP/diag" && cd "$RUNNER_TEMP/diag"
          unzip -q -o "$RUNNER_TEMP/ipa/HivePulse.ipa"
          APP="Payload/HivePulse.app"
          echo "=== archived app signature ==="
          codesign -dvvv "$RUNNER_TEMP/HivePulse.xcarchive/Products/Applications/HivePulse.app" 2>&1 | grep -E "Authority|TeamIdentifier|Signature|Identifier=" || true
          echo "=== exported app signature ==="
          codesign -dvvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Signature|Identifier=|Format" || true
          echo "=== exported entitlements ==="
          codesign -d --entitlements - "$APP" 2>&1 | head -30 || true
          echo "=== embedded profile ==="
          security cms -D -i "$APP/embedded.mobileprovision" 2>/dev/null | plutil -extract Name raw - 2>/dev/null || echo "no embedded.mobileprovision"
          echo "=== strict verify (must satisfy its designated requirement, or App Store Connect rejects with 90035) ==="
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Export & upload to App Store Connect
        if: steps.secrets.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.hivepulse.app</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HivePulse.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Summary
        if: steps.secrets.outputs.ready == 'true'
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' ios/HivePulse/Resources/Info.plist)
          {
            echo "### Uploaded HivePulse $VERSION ($BUILD_NUMBER) to App Store Connect"
            echo "Processing takes about 5–15 minutes; the build then appears in TestFlight for internal testers."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect Xcode distribution logs
        if: failure() && steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/distlogs"
          find "${TMPDIR:-/tmp}" /var/folders -name "*.xcdistributionlogs" -maxdepth 6 -type d 2>/dev/null \
            -exec cp -R {} "$RUNNER_TEMP/distlogs/" \; || true
          ls -la "$RUNNER_TEMP/distlogs"

      - name: Upload distribution logs
        if: failure() && steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: testflight-distribution-logs
          path: ${{ runner.temp }}/distlogs
          if-no-files-found: warn
          retention-days: 7

      - name: Remove API key and signing keychain
        if: always() && steps.secrets.outputs.ready == 'true'
        run: |
          rm -f "$ASC_KEY_PATH" "$RUNNER_TEMP/asc_api_key.json" "$RUNNER_TEMP/dist.p12"
          if [ -n "$SIGNING_KEYCHAIN" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
