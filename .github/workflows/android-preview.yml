name: Android Preview

# Builds a debug-signed APK against the production API and publishes it as a
# GitHub pre-release, so testers get a public download link for sideloading.

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Release title, e.g. "Android Preview 9 (2026-09-30)"'
        required: true
        type: string
      notes:
        description: 'Release notes (Markdown)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and publish preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        # SENTRY_DSN_ANDROID is optional: without it the APK ships with crash reporting off.
        env:
          SENTRY_DSN_ANDROID: ${{ secrets.SENTRY_DSN_ANDROID }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m" \
            -PBASE_URL="https://hivepulse.multihead.de/api/v1/"

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          tag="android-preview-$(date -u +%Y-%m-%d)-${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "hivepulse-${tag}.apk"
          printf '%s\n\n**Build:** Commit %s, debug-signiert, Server https://hivepulse.multihead.de/api/v1/\n' \
            "$NOTES" "${GITHUB_SHA::7}" > notes.md
          gh release create "$tag" "hivepulse-${tag}.apk" \
            --prerelease --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/hivepulse-${tag}.apk" >> "$GITHUB_STEP_SUMMARY"
