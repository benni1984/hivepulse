name: Play Metadata

# Puts the Google Play store listing — texts, screenshots, icon and feature graphic — into the
# Play Console, so none of it is typed or dragged in by hand in five languages. The counterpart
# of "App Store Metadata" for the other store.
#
# The texts come from docs/store-listing.md and nowhere else. scripts/build_play_metadata.py
# turns them into files and checks Play's length limits first, so a text that is too long fails
# here, before anything is sent.
#
# It never releases anything: the bundle and the "What's new" notes go up with "Android Release
# Bundle". This changes the listing around them, which Play reviews on its own.
#
# Starts as a dry run: it builds and checks the files and attaches them to the run as an
# artifact, and sends nothing. Untick "dry_run" to upload.
#
# Uses the same service account as the release upload (secret PLAY_SERVICE_ACCOUNT_JSON); it
# needs the "edit store listing" permission, which docs/android-release-setup.md step 5 grants.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only build and check the files; send nothing to Play.'
        required: true
        default: true
        type: boolean
      screenshots:
        description: 'Which pictures to send'
        required: true
        default: latest
        type: choice
        options:
          # Newest successful "Android Store Screenshots" run — the normal choice.
          - latest
          # Change the texts only and leave the pictures in the console as they are.
          - keep
          # Take the run typed into screenshots_run_id below.
          - run_id
      screenshots_run_id:
        description: 'Only read when "Which pictures to send" is run_id: the ID of a successful "Android Store Screenshots" run.'
        required: false
        default: ''
        type: string
      changes_not_sent_for_review:
        description: 'Tick when the console has other pending changes — otherwise Play rejects the edit.'
        required: false
        default: false
        type: boolean

concurrency:
  group: play-metadata
  cancel-in-progress: false

jobs:
  metadata:
    name: Play metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run }}
      SHOTS: ${{ inputs.screenshots }}
      SHOTS_INPUT: ${{ inputs.screenshots_run_id }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and check the texts
        run: |
          mkdir -p build
          python scripts/build_play_metadata.py --out build/play | tee build/summary.txt || exit 1
          {
            echo '### Play listing texts'
            echo '```'
            cat build/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      # A dropdown, because the three things anybody ever wanted here are "the newest ones",
      # "do not touch them" and "that particular run". GitHub cannot list run IDs in a choice, so
      # the ID keeps its own field.
      #
      # Both branches ask for the artefact, not for a workflow name. "Android Store Screenshots" normally runs as a
      # workflow_call from "Update help page screenshots", and a called workflow gets no run entry
      # of its own, so `gh run list --workflow` only ever saw the last run somebody dispatched by
      # hand. On 2026-11-03 that silently sent a month-old set of pictures to the store while a
      # fresh one sat in the run from the same morning. What matters is which run holds the
      # pictures, so that is what is looked up.
      - name: Decide which pictures to send
        run: |
          case "$SHOTS" in
            keep)
              echo 'Texts only - the pictures in the console stay as they are.'
              RUN=''
              ;;
            latest)
              RUN=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name=play-screenshots-en -f per_page=30 --jq 'first(.artifacts[] | select(.expired == false) | .workflow_run.id) // empty')
              test -n "$RUN" || { echo "::error::no unexpired 'play-screenshots-en' artefact anywhere - run 'Update help page screenshots' first"; exit 1; }
              echo "Newest run holding the pictures: $RUN"
              ;;
            run_id)
              RUN="$SHOTS_INPUT"
              test -n "$RUN" || { echo "::error::'run_id' was chosen, so screenshots_run_id has to hold one"; exit 1; }
              FOUND=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts" --jq 'first(.artifacts[] | select(.name == "play-screenshots-en" and .expired == false) | .name) // empty')
              test -n "$FOUND" || { echo "::error::run $RUN has no unexpired 'play-screenshots-en' artefact - wrong run, or its artefacts have aged out"; exit 1; }
              echo "Run $RUN holds the pictures"
              ;;
          esac
          echo "SHOTS_RUN=$RUN" >> "$GITHUB_ENV"

      - name: Fetch the screenshots
        if: env.SHOTS_RUN != ''
        run: |
          declare -A LOCALE=([en]=en-US [de]=de-DE [fr]=fr-FR [es]=es-ES [pl]=pl-PL)
          for lang in en de fr es pl; do
            dir="build/play-screenshots/${LOCALE[$lang]}"
            mkdir -p "$dir"
            gh run download "$SHOTS_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "play-screenshots-$lang" --dir "$dir"
            count=$(find "$dir" -name '*.png' | wc -l)
            echo "$lang: $count screenshots"
            test "$count" -ge 1 || { echo "::error::no screenshots for $lang in run $SHOTS_RUN"; exit 1; }
          done

      - name: Check what would be sent
        run: |
          if [ -n "$SHOTS_RUN" ]; then SHOTS=(--screenshots build/play-screenshots); else SHOTS=(); fi
          python scripts/upload_play_metadata.py --metadata build/play "${SHOTS[@]}" --dry-run
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: play-metadata
          path: |
            build/play
            build/play-screenshots
          retention-days: 14

      - name: Dry run ends here
        if: env.DRY_RUN == 'true'
        run: echo "Dry run - the files are attached to this run, nothing was sent to Play."

      - name: Check the service account secret is present
        if: env.DRY_RUN != 'true'
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set — see docs/android-release-setup.md step 5." >&2
            exit 1
          fi

      - name: Install the Play API client
        if: env.DRY_RUN != 'true'
        run: pip install --quiet google-api-python-client google-auth

      - name: Send to Play
        if: env.DRY_RUN != 'true'
        run: |
          if [ -n "$SHOTS_RUN" ]; then SHOTS=(--screenshots build/play-screenshots); else SHOTS=(); fi
          python scripts/upload_play_metadata.py --metadata build/play "${SHOTS[@]}" \
            ${{ inputs.changes_not_sent_for_review && '--changes-not-sent-for-review' || '' }}
        shell: bash
