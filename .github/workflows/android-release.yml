name: Android Release Bundle

# Builds the signed .aab that Google Play accepts, attaches it to the run as an artifact,
# and — when a track is given — uploads it to Play with the release notes from
# distribution/whatsnew/. Deliberately not a public release: the bundle is signed with the
# upload key and belongs in the Play Console, not on a download page. The public preview APK
# has its own workflow (android-preview.yml).
#
# Setup for the keystore, the service account and the secrets: docs/android-release-setup.md

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version shown to users, e.g. "1.0.0"'
        required: true
        type: string
      version_code:
        description: 'Version code; must be higher than every previous upload. Leave empty to use the run number.'
        required: false
        default: ''
        type: string
      track:
        description: 'Upload to this Play track. "none" only builds the artifact.'
        required: true
        default: none
        type: choice
        options: [none, internal, alpha, beta, production]
      status:
        description: 'draft leaves it for you to roll out in the console; completed releases it to that track.'
        required: true
        default: draft
        type: choice
        options: [draft, completed]
      changes_not_sent_for_review:
        description: 'Tick when the console has other pending changes — otherwise Play rejects the upload.'
        required: false
        default: false
        type: boolean

jobs:
  bundle:
    name: Build signed app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v3

      - name: Check the signing secrets are present
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing" >&2
            echo "See docs/android-release-setup.md — an unsigned bundle would be rejected by Play." >&2
            exit 1
          fi

      - name: Write the upload keystore from the secret
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # A truncated or mis-pasted secret decodes into something unusable; fail here
          # rather than two minutes into the build with an opaque Gradle error.
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > /dev/null
          echo "Keystore decoded and readable"

      - name: Resolve the version
        id: version
        env:
          REQUESTED_CODE: ${{ inputs.version_code }}
        run: |
          code="${REQUESTED_CODE:-$GITHUB_RUN_NUMBER}"
          case "$code" in
            ''|*[!0-9]*) echo "version_code must be a whole number, got '$code'" >&2; exit 1;;
          esac
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version ${{ inputs.version_name }} (code $code)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the app bundle
        env:
          SENTRY_DSN_ANDROID: ${{ secrets.SENTRY_DSN_ANDROID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m" \
            -PBASE_URL="https://hivepulse.multihead.de/api/v1/" \
            -PVERSION_NAME="${{ inputs.version_name }}" \
            -PVERSION_CODE="${{ steps.version.outputs.code }}"

      - name: Confirm the bundle is signed
        run: |
          bundle="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$bundle" || { echo "No bundle at $bundle" >&2; exit 1; }
          # An unsigned bundle builds happily and is then rejected on upload, so check here.
          unzip -l "$bundle" | grep -q "META-INF/.*\.RSA\|META-INF/.*\.EC\|META-INF/MANIFEST.MF" \
            || { echo "Bundle carries no signature block" >&2; exit 1; }
          ls -lh "$bundle" >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm the native libraries support 16 KB pages
        run: |
          # Play only reports this after the upload, in the bundle explorer, where it is easy
          # to miss — 1.0.0 (3) reached Google's review with a 4 KB CameraX library.
          python3 scripts/check_16kb_alignment.py \
            android/app/build/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: hivepulse-${{ inputs.version_name }}-${{ steps.version.outputs.code }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      # ── Upload to Play, only when a track was chosen ───────────────────────────
      - name: Check the service account secret is present
        if: inputs.track != 'none'
        env:
          KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set — see docs/android-release-setup.md step 5." >&2
            exit 1
          fi
          # A truncated paste is the usual failure and the API error for it is unhelpful.
          printf '%s' "$KEY" | python3 -c "import json,sys; d=json.load(sys.stdin); print('service account:', d['client_email'])"

      - name: Check the release notes exist for every language
        if: inputs.track != 'none'
        run: |
          missing=""
          for locale in de-DE en-US fr-FR es-ES pl-PL; do
            file="distribution/whatsnew/whatsnew-$locale"
            if [ ! -s "$file" ]; then
              missing="$missing $locale"
            # Characters, not bytes: wc -c counts bytes and would reject a French text of
            # 489 characters because its accents make it 494 bytes.
            elif ! python3 -c "import sys,pathlib; t=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'); sys.exit(0 if len(t) <= 500 else 1)" "$file"; then
              echo "::error::$file is longer than the 500 characters Play allows" >&2
              exit 1
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::release notes missing for:$missing" >&2
            exit 1
          fi
          echo "Release notes present and within the limit for all five languages"

      - name: Upload to Play
        if: inputs.track != 'none'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hivepulse.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          whatsNewDirectory: distribution/whatsnew
          changesNotSentForReview: ${{ inputs.changes_not_sent_for_review }}

      - name: Summary
        if: inputs.track != 'none'
        run: |
          {
            echo "### Uploaded to Play"
            echo ""
            echo "- Track: ${{ inputs.track }}"
            echo "- Status: ${{ inputs.status }}"
            echo "- Version: ${{ inputs.version_name }} (${{ steps.version.outputs.code }})"
            echo ""
            echo "A draft still has to be rolled out in the console. Play reviews every"
            echo "release, including closed tests, so being uploaded is not being available."
          } >> "$GITHUB_STEP_SUMMARY"
