name: App Store Metadata

# Puts the App Store listing texts, and optionally the screenshots, into App Store Connect, so
# they are not typed in by hand in five languages.
#
# The texts come from docs/store-listing.md and nowhere else. scripts/build_appstore_metadata.py
# turns them into the folder layout fastlane's `deliver` uploads and checks Apple's length limits
# first, so a text that is too long fails here, before anything is sent.
#
# It never submits for review and never releases. The version is left as a draft in App Store
# Connect for a person to look at and send off.
#
# Starts as a dry run: it builds and checks the files and attaches them to the run as an
# artifact, and sends nothing. Untick "dry_run" to upload.
#
# Uses the same App Store Connect API key as TestFlight (secrets APP_STORE_CONNECT_KEY_ID,
# APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_API_KEY_P8).
#
# Not covered, and done once by hand in App Store Connect: the App Privacy answers, which
# Apple does not offer through the API, the age rating, the review notes and the demo account.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only build and check the files; send nothing to Apple.'
        required: true
        default: true
        type: boolean
      app_version:
        description: 'App Store version the texts belong to. Created when it does not exist yet.'
        required: true
        default: '1.0.0'
        type: string
      include_release_notes:
        description: 'Also send "What''s New". Apple rejects it on the very first version.'
        required: true
        default: false
        type: boolean
      screenshots:
        description: 'Which pictures to send'
        required: true
        default: latest
        type: choice
        options:
          # Newest successful "iOS Store Screenshots" run — the normal choice.
          - latest
          # Change the texts only and leave the pictures in the console as they are.
          - keep
          # Take the run typed into screenshots_run_id below.
          - run_id
      screenshots_run_id:
        description: 'Only read when "Which pictures to send" is run_id: the ID of a successful "iOS Store Screenshots" run.'
        required: false
        default: ''
        type: string

concurrency:
  group: app-store-metadata
  cancel-in-progress: false

jobs:
  metadata:
    name: App Store metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run }}
      APP_VERSION: ${{ inputs.app_version }}
      SHOTS: ${{ inputs.screenshots }}
      SHOTS_INPUT: ${{ inputs.screenshots_run_id }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

    steps:
      - uses: actions/checkout@v4

      - name: Build and check the texts
        run: |
          mkdir -p build
          python3 scripts/build_appstore_metadata.py --out build/appstore \
            ${{ inputs.include_release_notes && '--release-notes' || '' }} | tee build/summary.txt || exit 1
          {
            echo '### App Store texts'
            echo '```'
            cat build/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      # A dropdown, because the three things anybody ever wanted here are "the newest ones",
      # "do not touch them" and "that particular run". GitHub cannot list run IDs in a choice, so
      # the ID keeps its own field.
      #
      # Both branches ask for the artefact, not for a workflow name. "iOS Store Screenshots" normally runs as a
      # workflow_call from "Update help page screenshots", and a called workflow gets no run entry
      # of its own, so `gh run list --workflow` only ever saw the last run somebody dispatched by
      # hand. On 2026-11-03 that silently sent a month-old set of pictures to the store while a
      # fresh one sat in the run from the same morning. What matters is which run holds the
      # pictures, so that is what is looked up.
      - name: Decide which pictures to send
        run: |
          case "$SHOTS" in
            keep)
              echo 'Texts only - the pictures in the console stay as they are.'
              RUN=''
              ;;
            latest)
              RUN=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name=app-store-screenshots-en -f per_page=30 --jq 'first(.artifacts[] | select(.expired == false) | .workflow_run.id) // empty')
              test -n "$RUN" || { echo "::error::no unexpired 'app-store-screenshots-en' artefact anywhere - run 'Update help page screenshots' first"; exit 1; }
              echo "Newest run holding the pictures: $RUN"
              ;;
            run_id)
              RUN="$SHOTS_INPUT"
              test -n "$RUN" || { echo "::error::'run_id' was chosen, so screenshots_run_id has to hold one"; exit 1; }
              FOUND=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts" --jq 'first(.artifacts[] | select(.name == "app-store-screenshots-en" and .expired == false) | .name) // empty')
              test -n "$FOUND" || { echo "::error::run $RUN has no unexpired 'app-store-screenshots-en' artefact - wrong run, or its artefacts have aged out"; exit 1; }
              echo "Run $RUN holds the pictures"
              ;;
          esac
          echo "SHOTS_RUN=$RUN" >> "$GITHUB_ENV"

      - name: Fetch the screenshots
        if: env.SHOTS_RUN != ''
        run: |
          declare -A FOLDER=([en]=en-US [de]=de-DE [fr]=fr-FR [es]=es-ES [pl]=pl)
          for lang in en de fr es pl; do
            dir="build/appstore/screenshots/${FOLDER[$lang]}"
            mkdir -p "$dir"
            gh run download "$SHOTS_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "app-store-screenshots-$lang" --dir "$dir"
            count=$(find "$dir" -name '*.png' | wc -l)
            echo "$lang: $count screenshots"
            test "$count" -ge 1 || { echo "::error::no screenshots for $lang in run $SHOTS_RUN"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: app-store-metadata
          path: build/appstore
          retention-days: 14

      - name: Dry run ends here
        if: env.DRY_RUN == 'true'
        run: echo "Dry run - the files are attached to this run, nothing was sent to Apple."

      - name: Check the App Store Connect secrets
        if: env.DRY_RUN != 'true'
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::The App Store Connect secrets are not all set (see the header of testflight.yml)."
              exit 1
            fi
          done

      - uses: ruby/setup-ruby@v1
        if: env.DRY_RUN != 'true'
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        if: env.DRY_RUN != 'true'
        run: gem install fastlane --no-document

      - name: Send to App Store Connect
        if: env.DRY_RUN != 'true'
        run: |
          KEY_JSON="$RUNNER_TEMP/asc-key.json"
          python3 -c 'import json,os; print(json.dumps({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"], "key": os.environ["ASC_KEY_P8"], "in_house": False}))' > "$KEY_JSON"
          chmod 600 "$KEY_JSON"
          trap 'rm -f "$KEY_JSON"' EXIT

          if [ -n "$SHOTS_RUN" ]; then SKIP_SHOTS=false; else SKIP_SHOTS=true; fi
          mkdir -p build/appstore/screenshots

          # Without a Deliverfile deliver stops to ask "Do you want to setup deliver?", which cannot be
          # answered on a runner (first real run, 37992068592). An empty one counts as the configuration;
          # everything is passed as options below.
          touch Deliverfile

          fastlane deliver \
            --api_key_path "$KEY_JSON" \
            --app_identifier com.hivepulse.app \
            --app_version "$APP_VERSION" \
            --metadata_path build/appstore/metadata \
            --screenshots_path build/appstore/screenshots \
            --skip_binary_upload true \
            --skip_screenshots "$SKIP_SHOTS" \
            --overwrite_screenshots true \
            --force true \
            --submit_for_review false \
            --automatic_release false \
            --run_precheck_before_submit false
