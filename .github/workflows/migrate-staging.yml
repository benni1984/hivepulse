name: Migrate Staging DB

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrate:
    name: Run alembic upgrade head (staging)
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: prj_ZUxzSh8GAjSUBkQrxxYHqAq57SE1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment (staging)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Run database migrations
        run: |
          # `vercel pull` cannot read back a variable stored as Sensitive, so it writes the
          # literal placeholder [SENSITIVE] where that variable's value belongs. Sourcing it
          # hands the settings a string where a boolean or a number goes, and the step dies
          # naming pydantic and a field rather than the pull. WEB_CHECKOUT_ENABLED took
          # staging, the E2E gate and the production deploy down this way, for three merges
          # in a row, while every quality gate stayed green (#536).
          #
          # A placeholder is not a value, so leave it out and let the field's default stand --
          # for a feature flag that is the closed position. Nothing live depends on this file:
          # it exists to run migrations, and the deployed app reads the real values from the
          # platform, where a sensitive variable works normally.
          ENV_FILE=.vercel/.env.production.local
          UNREADABLE=$(grep -E '^[A-Za-z_][A-Za-z0-9_]*="?\[SENSITIVE\]"?$' "$ENV_FILE" | cut -d= -f1 | paste -sd' ' - || true)
          if [ -n "$UNREADABLE" ]; then
            echo "::warning::vercel pull could not read these (stored as Sensitive); they stay unset for the migration: $UNREADABLE"
            { grep -vE '^[A-Za-z_][A-Za-z0-9_]*="?\[SENSITIVE\]"?$' "$ENV_FILE" || true; } > "$ENV_FILE.readable"
            mv "$ENV_FILE.readable" "$ENV_FILE"
          fi
          set -a && source "$ENV_FILE" && set +a
          STATE=$(python3 scripts/check_alembic_state.py)
          echo "Current alembic state: $STATE"
          case "$STATE" in
            no_version_table|no_version_row|001|002|003|004|005)
              echo "Stamping to 006 (schema exists but tracking is at '$STATE')..."
              (cd backend && alembic stamp 006)
              ;;
          esac
          (cd backend && alembic upgrade head)
