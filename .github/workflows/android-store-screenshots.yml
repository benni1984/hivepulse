name: Android Store Screenshots

# Captures the Play store screenshots in all five store languages, by driving the debug build
# on an emulator once per language. Play accepts up to 8 phone screenshots per language, each
# side between 320 and 3840 pixels, as a JPEG or a 24-bit PNG — `adb screencap` writes RGBA,
# so the script flattens every capture before saving.
#
# The languages run as a matrix rather than in one job: an emulator run takes most of the
# time, five of them in parallel cost the same wall clock as one, and a language that fails
# does not take the other four with it.

on:
  workflow_dispatch:
  # Called by "Update help page screenshots" when the interface changed, so the store sets are
  # retaken automatically too. Their pictures stay workflow artifacts (store listings are uploaded
  # by hand); the iPhone help images are cut from the English set.
  workflow_call:
    inputs:
      ref:
        description: 'Commit to photograph (the one the screenshot manifest describes)'
        required: false
        type: string
        default: ''

jobs:
  capture:
    name: Play screenshots (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # A German listing showing an English interface reads as "not translated" — the one
        # screenshot detail that actually changes whether somebody installs.
        language: [de, en, fr, es, pl]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Enable KVM (speeds up the emulator about tenfold)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m" \
            -PBASE_URL="https://apiscan-staging.vercel.app/api/v1/"

      - name: Capture
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SCREENSHOT_LANG: ${{ matrix.language }}
          SCREENSHOT_DIR: store-screenshots
          # Not the demo account: the staging E2E suite signs in as demo and leaves its
          # apiaries behind, so its list reads "e2e-apiary-1790951543272" seven times over.
          # These accounts are seeded for this purpose and nothing else writes to them.
          DEMO_EMAIL: screenshots-${{ matrix.language }}@apiscan.app
          # Not a secret and deliberately not STAGING_DEMO_PASSWORD: these accounts are
          # created by the seed with this literal, and pointing at a secret that may have
          # been rotated made all four languages fail with "login failed" while the account
          # itself was fine. The value lives in seed_staging.py; a test keeps the two equal.
          DEMO_PASSWORD: demo1234
        with:
          # API 34: per-app languages need Android 13 or newer, and the help-page capture
          # already runs reliably on this image.
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          heap-size: 512M
          disk-size: 4096M
          ram-size: 2048M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: python3 -u scripts/android-store-screenshots.py

      - name: Check the images are a size Play accepts
        run: |
          python3 - <<'CHECK'
          import os
          import sys
          from pathlib import Path
          from PIL import Image

          folder = Path("store-screenshots/${{ matrix.language }}")
          shots = sorted(folder.glob("*.png"))
          if not shots:
              print("::error::No screenshots were written although the capture step succeeded.")
              sys.exit(1)
          if len(shots) > 8:
              print(f"::error::{len(shots)} screenshots — Play accepts at most 8 per language.")
              sys.exit(1)

          problems = 0
          lines = ["### Play screenshots", "", "- Language: ${{ matrix.language }}", f"- Images: {len(shots)}", ""]
          for shot in shots:
              with Image.open(shot) as image:
                  w, h = image.size
                  note = ""
                  if image.mode != "RGB":
                      note, problems = f" — {image.mode}, Play wants a 24-bit PNG", problems + 1
                  elif not (320 <= w <= 3840 and 320 <= h <= 3840):
                      note, problems = " — outside Play's 320–3840 px range", problems + 1
                  lines.append(f"- `{shot.name}` {w}x{h}{note}")
                  if note:
                      print(f"::warning file={shot}::{shot.name} is {w}x{h} {image.mode}{note}")

          Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a").write("\n".join(lines) + "\n")
          if problems:
              print(f"::error::{problems} of {len(shots)} images are not acceptable to Play.")
              sys.exit(1)
          print(f"All {len(shots)} images are acceptable to Play")
          CHECK

      - uses: actions/upload-artifact@v4
        with:
          name: play-screenshots-${{ matrix.language }}
          path: store-screenshots/${{ matrix.language }}/*.png
          retention-days: 30
          if-no-files-found: error

      - name: Upload capture diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: play-screenshot-diagnostics-${{ matrix.language }}
          path: _screenshot-debug/
          retention-days: 3
          if-no-files-found: ignore
