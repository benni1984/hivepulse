name: iOS Store Screenshots

# Captures the App Store screenshots in all four store languages, by running the existing
# ScreenshotUITests once per language on the largest iPhone simulator the runner has. Nothing new is photographed — the same screens the design
# review already captures, on a device whose pixel size App Store Connect accepts.
#
# Apple requires one set for the 6.9" iPhone slot and derives the smaller sizes from it; the
# accepted pixel sizes for that slot are 1320×2868 and 1290×2796. An upload is rejected over a
# single wrong pixel, so the size is checked here rather than in the console.
#
# The device list of the macOS runner image changes without notice — hence a preference list
# instead of one pinned device, and a check against every accepted size instead of one pair.

on:
  workflow_dispatch:

jobs:
  capture:
    name: App Store screenshots (${{ matrix.language }})
    runs-on: macos-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # The store lists each language separately, and a German listing showing an English
        # interface reads as "not translated" — the one screenshot detail that actually
        # changes whether somebody installs.
        language: [de, en, fr, es]

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Whatever the image ships, like the other iOS jobs — a pinned version disappears with
        # the next runner image.
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Resolve the largest available iPhone simulator
        run: |
          available=$(xcrun simctl list devices available)
          for candidate in \
            "iPhone 17 Pro Max" \
            "iPhone 16 Pro Max" \
            "iPhone 15 Pro Max" \
            "iPhone 17 Plus" \
            "iPhone 16 Plus"
          do
            udid=$(printf '%s\n' "$available" | grep -F "$candidate (" | head -1 | awk -F'[()]' '{print $2}')
            if [ -n "$udid" ]; then
              echo "Using $candidate ($udid)"
              echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
              echo "SIMULATOR_NAME=$candidate" >> "$GITHUB_ENV"
              break
            fi
          done
          if [ -z "${SIMULATOR_UDID:-}" ] && ! grep -q SIMULATOR_UDID "$GITHUB_ENV"; then
            echo "::error::None of the candidate simulators exist on this runner image."
            echo "Available iPhone simulators:"
            printf '%s\n' "$available" | grep iPhone || true
            exit 1
          fi

      - name: Capture
        env:
          SCREENSHOT_LANG: ${{ matrix.language }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/screenshots"
          # Only the screenshot class: the rest of the UI suite has nothing to contribute here
          # and would triple the runtime.
          TEST_RUNNER_SCREENSHOT_DIR="$GITHUB_WORKSPACE/screenshots" xcodebuild test \
            -project ios/HivePulse.xcodeproj \
            -scheme HivePulse \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:HivePulseUITests/ScreenshotUITests \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -resultBundlePath "StoreScreenshots-${{ matrix.language }}"

      - name: Check the images are a size App Store Connect accepts
        run: |
          cd "$GITHUB_WORKSPACE/screenshots/${{ matrix.language }}"
          count=$(ls -1 *.png 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::error::No screenshots were written although the capture step succeeded."
            exit 1
          fi
          # The 6.9" iPhone slot; Apple derives the smaller device sizes from it.
          accepted="1320x2868 2868x1320 1290x2796 2796x1290"
          wrong=0
          sizes=""
          for f in *.png; do
            read -r w h <<< "$(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/ {printf "%s ", $2}')"
            case " $accepted " in
              *" ${w}x${h} "*) ;;
              *) echo "::warning file=$f::$f is ${w}x${h}, which the 6.9\" slot does not accept"
                 wrong=$((wrong + 1));;
            esac
            sizes="$sizes ${w}x${h}"
          done
          {
            echo "### App Store screenshots"
            echo ""
            echo "- Language: ${{ matrix.language }}"
            echo "- Simulator: $SIMULATOR_NAME"
            echo "- Images: $count, $wrong with a size the store does not accept"
            echo "- Sizes seen:$(printf '%s\n' $sizes | sort -u | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$wrong" -gt 0 ]; then
            echo "::error::$wrong of $count images are not an accepted 6.9\" size."
            exit 1
          fi
          echo "All $count images are an accepted size"

      - name: Pick the eight the stores accept
        run: |
          # Play allows 8 phone screenshots per language, the App Store 10. The full set is
          # the design review's job; a listing gets the core.
          src="$GITHUB_WORKSPACE/screenshots/${{ matrix.language }}"
          out="$GITHUB_WORKSPACE/store/${{ matrix.language }}"
          mkdir -p "$out"
          i=1
          # Open a hive, record a visit, tap the frame count, work without a signal,
          # read the season, track hornets, print the QR codes.
          names="03-apiaries 05-hive-detail 18-inspection-form 19-inspection-frames"
          names="$names 20-offline-pending 21-hive-stats 22-hornets 08-qr-batches"
          for name in $names
          do
            if [ -f "$src/$name.png" ]; then
              cp "$src/$name.png" "$out/$(printf '%d' $i)-$name.png"
              i=$((i + 1))
            else
              echo "::warning::$name.png was not captured, the listing set is one short"
            fi
          done
          count=$((i - 1))
          echo "Selected $count screenshots for the listing" >> "$GITHUB_STEP_SUMMARY"
          test "$count" -ge 4 || { echo "::error::only $count of 8 made it"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-store-screenshots-${{ matrix.language }}
          path: store/${{ matrix.language }}/*.png
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-screenshots-${{ matrix.language }}
          path: screenshots/${{ matrix.language }}/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload the result bundle when something went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-results-${{ matrix.language }}
          path: StoreScreenshots-${{ matrix.language }}.xcresult
          retention-days: 7
