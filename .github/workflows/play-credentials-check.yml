name: Play credentials check

# Proves the Play service account works without creating anything: it opens an edit
# session, reads the tracks and discards the session again.
#
# Worth having because an upload is an expensive way to discover a bad key — Play never
# accepts the same version code twice, so a failed attempt costs the next number. Run this
# after creating or rotating the key, or whenever an upload fails in a way that might be
# about permissions rather than the bundle.

on:
  workflow_dispatch:

jobs:
  check:
    name: Can the service account reach Play
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install google-auth
        run: pip install --quiet google-auth requests

      - name: Check
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python scripts/check_play_credentials.py
