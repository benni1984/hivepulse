name: HivePulse

options:
  bundleIdPrefix: com.hivepulse
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.44.0
  # Pinned to 8.x deliberately: 10.x is recent enough that its API is not something to
  # guess at, and the call we make here has been stable across 7 and 8.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  HivePulse:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - package: Sentry
        product: Sentry
      - package: GoogleSignIn
        product: GoogleSignIn
    sources:
      - path: HivePulse
        excludes:
          - Resources/Info.plist   # referenced via INFOPLIST_FILE, not compiled
    resources:
      - path: HivePulse/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hivepulse.app
        INFOPLIST_FILE: HivePulse/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HivePulse/HivePulse.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # single 1024px icon in Resources/Assets.xcassets
        CURRENT_PROJECT_VERSION: "1"                  # build number; the TestFlight workflow overrides it per upload
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          API_BASE_URL: http://localhost:8000/api/v1
          SENTRY_DSN: ""
        Release:
          API_BASE_URL: https://hivepulse.multihead.de/api/v1
          # Filled by the TestFlight workflow from the SENTRY_DSN_IOS secret; empty here
          # so a local build and a build from source report nothing.
          SENTRY_DSN: ""

  HivePulseTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HivePulseTests
    dependencies:
      - target: HivePulse
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hivepulse.tests

  HivePulseUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HivePulseUITests
      # The screenshot test looks elements up by their translated label, so it needs the same
      # strings the app has. A UI test runs in its own process and cannot read the app bundle.
      - path: HivePulse/Resources/en.lproj
        buildPhase: resources
      - path: HivePulse/Resources/de.lproj
        buildPhase: resources
      - path: HivePulse/Resources/fr.lproj
        buildPhase: resources
      - path: HivePulse/Resources/es.lproj
        buildPhase: resources
    dependencies:
      - target: HivePulse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hivepulse.uitests

schemes:
  HivePulse:
    build:
      targets:
        HivePulse: all
        HivePulseTests: [test]
        HivePulseUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HivePulseTests
        - HivePulseUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
